# Runs on every push to main and every pull request: the same checks I run by hand.
# A red X here means "do not deploy this yet". (Test-only keys below are not secrets.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egaro
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: egaro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U egaro"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://egaro:testpw@localhost:5432/egaro_test
      AUTH_SECRET: ci-test-auth-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      CRON_SECRET: ci-test-cron-secret-0123456789
      LMS_BASE_URL: http://localhost:4000
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_SECURE: "false"
      MAIL_FROM: "e-GURO Companion <test@example.com>"
      DELAY_BETWEEN_USERS_MS: "0"
      INVITE_CODE: class-2026
      APP_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: No secrets committed
        run: npm run check:secrets
      - name: Every student-data query is limited to its owner
        run: npm run check:ownership
      - name: Types
        run: npx tsc --noEmit
      - name: Parser tests
        run: npm run test:parsers
      - name: Create the test database
        run: npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: End-to-end test (pretend e-GURO + fake mail server)
        run: |
          PORT=3010 npx next start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3010/api/health > /dev/null && break; sleep 2; done
          APP_URL=http://localhost:3010 node scripts/dev/e2e.mjs
      - name: Show the server log if something failed
        if: failure()
        run: tail -n 80 server.log || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Known vulnerabilities in dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
