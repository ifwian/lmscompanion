# Free scheduler: every ~15 minutes GitHub calls your deployed app's checker endpoint.
# The checker itself runs on Vercel (not here), so e-GURO sees requests from Vercel, not from GitHub.
# Needs two repository secrets: APP_URL (for example https://your-app.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Check LMS

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs by several minutes
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the checker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET" || { echo "APP_URL and CRON_SECRET secrets are required"; exit 1; }
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90 "$APP_URL/api/cron/check")
          echo "HTTP status: $status"
          cat response.json
          test "$status" = "200"
